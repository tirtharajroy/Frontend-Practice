<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="images/icon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Simple Calc</title>
</head>
<body>
    <header class="flex-center">
        <h1>Simple Calculator</h1>
    </header>
    <main  class="flex-center">
        <div class="calc">
            <div class="display_screen">
                <p class="screen flex-center"></p>
            </div>
            <div class="btns">
                <div class="zero flex-center">
                    <p>0</p>
                </div>
                <div class="one flex-center">
                    <p>1</p>
                </div>
                <div class="two flex-center">
                    <p>2</p>
                </div>
                <div class="three flex-center">
                    <p>3</p>
                </div>
                <div class="four flex-center">
                    <p>4</p>
                </div>
                <div class="five flex-center">
                    <p>5</p>
                </div>
                <div class="six flex-center">
                    <p>6</p>
                </div>
                <div class="seven flex-center">
                    <p>7</p>
                </div>
                <div class="eight flex-center">
                    <p>8</p>
                </div>
                <div class="nine flex-center">
                    <p>9</p>
                </div>
                <div class="plus flex-center">
                    <p>+</p>
                </div>
                <div class="minus flex-center">
                    <p>-</p>
                </div>
                <div class="equals flex-center">
                    <p>=</p>
                </div>
                <div class="multiply flex-center">
                    <p>*</p>
                </div>
                <div class="divide flex-center">
                    <p>%</p>
                </div>
            </div>
        </div>
    </main>
    <footer class="flex-center">
        <div class="social-icons">
            <a href="google.com"><i class="fa fa-linkedin-square fa-2x"></i></a>
            <a href="google.com"><i class="fa fa-github-square fa-2x"></i></a>
            <a href="google.com"><i class="fa fa-twitter-square fa-2x"></i></a>
            <a href="google.com"><i class="fa fa-instagram fa-2x"></i></a>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
